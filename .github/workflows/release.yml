name: release
# A tag vX.Y.Z on main: the image as X.Y.Z, X.Y and latest (with its SBOM and provenance), and the GitHub release with notes
# from the merged pull requests and a CycloneDX SBOM of the image. The tag must match pyproject.toml (repo-setup/releases.md).
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check the tag matches pyproject.toml
        run: |
          python3 - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          sys.exit(0 if tag == f"v{version}" else f"tag {tag}, pyproject {version}")
          PY
      - run: uv sync --frozen
      - run: uv run pytest -q
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/marceltov/karakeep-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/marceltov/karakeep-mcp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SBOM of the image
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/marceltov/karakeep-mcp@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: karakeep-mcp-${{ github.ref_name }}.cdx.json
          upload-artifact: false
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout has the tag as a plain ref; fetch the annotated tag for its headline.
          git fetch --force --depth=1 origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          headline=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" karakeep-mcp-*.cdx.json --title "$headline" --generate-notes
